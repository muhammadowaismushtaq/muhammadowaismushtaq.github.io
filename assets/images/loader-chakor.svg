<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 90" role="img" aria-label="Running chakor">
  <style>
    /* Running chakor loader. The bird is the logo mark (assets/images/logo-chakor.svg) leaning
       forward; transform origins below are in the logo's own 64x64 coordinates. */
    .bird { animation: bob 0.25s ease-in-out infinite alternate; }
    @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-2.5px); } }

    .leg-front { transform-origin: 32px 51px; animation: stride 0.5s ease-in-out infinite alternate; }
    .leg-back  { transform-origin: 24px 51px; animation: stride 0.5s ease-in-out infinite alternate-reverse; }
    @keyframes stride { from { transform: rotate(-38deg); } to { transform: rotate(38deg); } }

    .wing { transform-origin: 33px 31px; animation: flap 0.25s ease-in-out infinite alternate; }
    @keyframes flap { from { transform: rotate(-4deg); } to { transform: rotate(7deg); } }

    .tail { transform-origin: 13px 35px; animation: wag 0.25s ease-in-out infinite alternate; }
    @keyframes wag { from { transform: rotate(-6deg); } to { transform: rotate(9deg); } }

    .ground { stroke-dasharray: 7 9; animation: scroll 0.4s linear infinite; }
    @keyframes scroll { to { stroke-dashoffset: 32; } }

    .dust { transform-box: fill-box; transform-origin: center; opacity: 0; animation: dust 0.5s ease-out infinite; }
    .dust-late { animation-delay: 0.25s; }
    @keyframes dust {
      from { transform: translateX(0) scale(0.4); opacity: 0.7; }
      to   { transform: translateX(-16px) scale(1.3); opacity: 0; }
    }

    .speed { opacity: 0; animation: speed 0.6s linear infinite; }
    .speed-2 { animation-delay: 0.2s; }
    .speed-3 { animation-delay: 0.4s; }
    @keyframes speed {
      from { transform: translateX(6px); opacity: 0; }
      30%  { opacity: 0.8; }
      to   { transform: translateX(-10px); opacity: 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .dust, .speed { opacity: 0; }
    }
  </style>

  <!-- Ground scrolling past -->
  <line class="ground" x1="6" y1="77" x2="114" y2="77" stroke="#E5874A" stroke-opacity="0.45" stroke-width="2" stroke-linecap="round"/>

  <!-- Dust kicked up behind the feet -->
  <circle class="dust" cx="44" cy="74" r="3" fill="#E5874A"/>
  <circle class="dust dust-late" cx="50" cy="75" r="2.6" fill="#E5874A"/>

  <!-- Speed lines behind the tail -->
  <g stroke="#E5874A" stroke-width="2" stroke-linecap="round">
    <line class="speed" x1="12" y1="36" x2="22" y2="36"/>
    <line class="speed speed-2" x1="8" y1="44" x2="20" y2="44"/>
    <line class="speed speed-3" x1="14" y1="52" x2="23" y2="52"/>
  </g>

  <g class="bird">
    <g transform="translate(30 11) rotate(7 32 32)">
      <!-- Legs (behind the body) -->
      <g stroke="#C7361B" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" fill="none">
        <path class="leg-back" d="M24 51 L24 64 L28.5 64"/>
        <path class="leg-front" d="M32 51 L32 64 L36.5 64"/>
      </g>
      <!-- Tail -->
      <path class="tail" d="M14 34 L3 27.5 L6.5 40.5 Z" fill="#C9682E"/>
      <!-- Head, neck and body -->
      <path d="M53 12 C50 6 42 6 39.5 12 C38 16 38.5 20 37 24 C30 25 18 28 11 35 C7 40 9 48 15 51
               C22 55 34 56 41 51 C47 47 49 40 48.5 34 C48.3 29 50 25 52.5 21 C54 19 54.5 16 53 12 Z"
            fill="#E5874A"/>
      <!-- Wing -->
      <g class="wing"><ellipse cx="25" cy="33.5" rx="11.5" ry="6" transform="rotate(-14 25 33.5)" fill="#C9682E"/></g>
      <!-- Barred flank -->
      <g stroke="#1F1F1F" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M21 40.5 q1.5 3.8 0.7 7.5"/>
        <path d="M26.5 40 q1.5 4 0.7 8"/>
        <path d="M32 39.5 q1.5 3.8 0.7 7.5"/>
      </g>
      <!-- Pale throat and black necklace -->
      <path d="M53.2 16.5 C53.4 20.5 50.6 24.5 49 29.5 C48.4 32 48.6 34.5 48.5 36.5
               C45.6 34.5 44.2 30 44.6 25 C45 20.5 48 17.2 53.2 16.5 Z" fill="#FCE9D6"/>
      <path d="M54 14 L48.5 13.4 C45 13.4 43.2 17 43.2 22 C43.2 29 45 34.6 49 36.8"
            fill="none" stroke="#1F1F1F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Eye and beak -->
      <circle cx="47.6" cy="13.2" r="2.2" fill="#FFFFFF"/>
      <circle cx="48.1" cy="13.2" r="1.05" fill="#1F1F1F"/>
      <path d="M53.4 11.4 L59.6 14.4 L53.8 17.2 Z" fill="#C7361B"/>
    </g>
  </g>
</svg>
