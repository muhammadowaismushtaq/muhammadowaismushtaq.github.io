<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Chakor (chukar partridge) logo">
  <!-- Tail -->
  <path d="M14 34 L3 27.5 L6.5 40.5 Z" fill="#C9682E"/>
  <!-- Head, neck and body as one silhouette -->
  <path d="M53 12 C50 6 42 6 39.5 12 C38 16 38.5 20 37 24 C30 25 18 28 11 35 C7 40 9 48 15 51
           C22 55 34 56 41 51 C47 47 49 40 48.5 34 C48.3 29 50 25 52.5 21 C54 19 54.5 16 53 12 Z"
        fill="#E5874A"/>
  <!-- Wing -->
  <ellipse cx="25" cy="33.5" rx="11.5" ry="6" transform="rotate(-14 25 33.5)" fill="#C9682E"/>
  <!-- Barred flank -->
  <g stroke="#1F1F1F" stroke-width="2.2" stroke-linecap="round" fill="none">
    <path d="M21 40.5 q1.5 3.8 0.7 7.5"/>
    <path d="M26.5 40 q1.5 4 0.7 8"/>
    <path d="M32 39.5 q1.5 3.8 0.7 7.5"/>
  </g>
  <!-- Pale throat along the front of the neck -->
  <path d="M53.2 16.5 C53.4 20.5 50.6 24.5 49 29.5 C48.4 32 48.6 34.5 48.5 36.5
           C45.6 34.5 44.2 30 44.6 25 C45 20.5 48 17.2 53.2 16.5 Z" fill="#FCE9D6"/>
  <!-- Black stripe: beak, through the eye, then down the neck and across the breast as a necklace -->
  <path d="M54 14 L48.5 13.4 C45 13.4 43.2 17 43.2 22 C43.2 29 45 34.6 49 36.8"
        fill="none" stroke="#1F1F1F" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Eye -->
  <circle cx="47.6" cy="13.2" r="2.2" fill="#FFFFFF"/>
  <circle cx="48.1" cy="13.2" r="1.05" fill="#1F1F1F"/>
  <!-- Beak -->
  <path d="M53.4 11.4 L59.6 14.4 L53.8 17.2 Z" fill="#C7361B"/>
  <!-- Legs -->
  <g stroke="#C7361B" stroke-width="2.6" stroke-linecap="round">
    <path d="M24 53.5 L22.5 61"/>
    <path d="M32 53.5 L33.5 61"/>
  </g>
</svg>
